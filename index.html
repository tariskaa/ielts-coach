<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Coach</title>
<style>
:root{--bg:#fafaf7;--cd:#fff;--tx:#1c1c1a;--mu:#6b6b66;--ac:#0f766e;--bd:#e4e4de;--b7:#b45309;--b75:#1d4ed8;--b8:#0f766e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--cd:#1e1e1c;--tx:#ecece8;--mu:#a0a09a;--ac:#2dd4bf;--bd:#333330;--b7:#fbbf24;--b75:#60a5fa;--b8:#2dd4bf}}
:root[data-theme="dark"]{--bg:#141413;--cd:#1e1e1c;--tx:#ecece8;--mu:#a0a09a;--ac:#2dd4bf;--bd:#333330;--b7:#fbbf24;--b75:#60a5fa;--b8:#2dd4bf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 16px;z-index:9;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header span{color:var(--ac);font-weight:600;font-size:14px}
main{max-width:720px;margin:0 auto;padding:16px}
h2{margin:8px 0 12px;font-size:22px}h3{margin:20px 0 6px;font-size:16px;color:var(--ac)}
.mu{color:var(--mu);font-size:14px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
a.c{display:flex;align-items:center;gap:12px;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:8px;color:var(--tx);text-decoration:none}
a.c .n{background:var(--ac);color:var(--bg);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
a.c span:nth-child(2){flex:1}a.c b{color:var(--ac)}
table{display:block;overflow-x:auto;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border:1px solid var(--bd);padding:7px 9px;text-align:left;vertical-align:top;min-width:90px}
th{background:var(--cd);color:var(--ac)}
ul{padding-left:20px}li{margin:3px 0}
.s{background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:8px;padding:2px 12px;margin:10px 0;font-size:15px}
.s.b7{border-left-color:var(--b7)}.s.b75{border-left-color:var(--b75)}.s.b8{border-left-color:var(--b8)}
.bg{display:inline-block;font-weight:700;font-size:13px;margin-top:8px}
.b7 .bg{color:var(--b7)}.b75 .bg{color:var(--b75)}.b8 .bg{color:var(--b8)}
.nav{display:flex;gap:8px;margin:20px 0}.nav a,.nav button{flex:1;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);text-decoration:none;font:inherit;cursor:pointer}
.nav .dn{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
a.bk{color:var(--mu);text-decoration:none;font-size:14px}
label{display:block;padding:8px 0;border-bottom:1px solid var(--bd)}
</style></head><body>
<header><b>IELTS Coach</b><span id="sk">Writing</span></header>
<main id="a"></main>
<script>
const T=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
const L=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const S=(c,l,t)=>`<div class="s ${c}"><span class="bg">${l}</span><p>${t}</p></div>`;
// ADD NEW SKILLS / LESSONS HERE. Each lesson: {t:title, h:html}
const SK=[{id:'writing',name:'Writing',L:[
{t:'Band criteria and roadmap',h:`<p>Each criterion = 25%. Task 2 counts double Task 1.</p>`+T(['Criterion','Band 8 needs'],[['Task Response','Every part answered, clear position, ideas developed with examples'],['Coherence','One idea per paragraph, natural linking, reference words'],['Vocabulary','Precise collocations, rare errors'],['Grammar','Mostly error-free sentences, varied structures']])+`<h3>Priority order</h3>`+L(['Task Response: develop ideas (PEEL)','Accuracy: articles, tense, agreement','Collocations and topic vocab','Complex sentences, only if correct'])+`<h3>Timing</h3><p>Task 1: 20 min, 160–190 words. Task 2: 40 min, 270–290 words. Plan 5 min, proofread 3–5 min.</p>`},
{t:'Task 2: essay structure',h:T(['Step','Rule','Min'],[['Plan','Underline task words, pick position, 2 ideas + example each','5'],['Intro','Paraphrase question + state position','3'],['Body 1','Topic sentence → explain → example','12'],['Body 2','Same','12'],['Conclusion','Restate position, no new ideas','3'],['Check','Articles, plurals, tense, agreement','5']])+`<h3>Question types</h3>`+T(['Type','Must'],[['Opinion','State view, support it'],['Both views','Cover both, then your opinion'],['Problem–solution','Cover both parts'],['Two questions','Answer both equally']])+`<p>A missing part or unclear position caps you at Band 6.</p>`},
{t:'Task 1: report structure',h:L(['Intro: paraphrase the prompt (1 sentence)','Overview: 2 sentences, main trend + main contrast. <b>Never skip</b>','Body: group data by pattern, include numbers','No opinions, reasons or predictions'])+T(['Use','Words'],[['Up','rise, climb, grow, surge, soar'],['Down','fall, decline, drop, plummet'],['Stable','remain stable, plateau, level off'],['Up and down','fluctuate'],['Size','sharply, dramatically / slightly, marginally']])+`<p>Processes: passive (is collected). Maps: had been + V3 (had been demolished).</p>`},
{t:'Developing ideas',h:`<h3>6 lenses</h3><p>Individual · Community · Economy · Government · Environment · Education/technology. Pick the 2 that fit; each = one body paragraph.</p><h3>“So what?” ladder</h3>`+T(['Step','Example'],[['Claim','Public transport reduces congestion'],['Why','Commuters leave cars only if buses are faster or cheaper'],['So what','Fewer cars, free-flowing roads'],['Example','Singapore: metro + high vehicle taxes'],['Link','Better than building roads']])+`<h3>No experience?</h3><p>Use a country (Singapore, Finland, Norway, Japan), a hypothetical person or a general trend. Never invent exact statistics. Blank mind: cost · long vs short term · young vs old · rich vs poor · individual vs society.</p><h3>Quick topic bank</h3>`+T(['Topic','Idea 1','Idea 2'],[['Remote work','Saves commuting time','Weakens team culture'],['Study abroad','Language and cultural skills','High cost, homesickness'],['Social media','Connects families abroad','Harms teen mental health'],['Obesity','Cheap, heavily marketed fast food','Sugar taxes, labelling'],['Ageing population','Pension and healthcare costs','Experienced older workers'],['Fast fashion','Overconsumption, textile waste','Poor factory conditions']])},
{t:'Grammar structures',h:T(['Structure','Example'],[['Although (no “but”)','<b>Although</b> remote work saves time, it weakens teamwork.'],['Whereas / while','A rose to 90%, <b>whereas</b> B reached 85%.'],['Because','Roads jam <b>because</b> transport is unreliable.'],['Who / which / that','Staff <b>who</b> work remotely…; costs, <b>which</b> rose 12%…'],['Conditional 1 / 2','If cities invest, congestion <b>will</b> fall. If cars were banned, air <b>would</b> improve.'],['Passive','Funds <b>should be allocated</b> to rail.'],['Parallel','gain independence, <b>learn</b> languages, <b>make</b> friends'],['Despite + noun','<b>Despite</b> rising costs, enrolment grew.'],['Participle','<b>Investing</b> in rail, governments cut traffic.'],['Noun clause','<b>It is widely believed that</b>…'],['Not only…','<b>Not only does</b> exercise help health, <b>but it also</b> cuts stress.'],['The more…','<b>The more</b> cities expand, <b>the more</b> traffic they generate.'],['Inverted if','<b>Were</b> governments <b>to</b> invest…']])+`<p>Accuracy beats variety. Never “will” after if. Never “despite of”.</p>`},
{t:'Articles (a / the / zero)',h:T(['Use','Rule','Example'],[['a / an','First mention, countable singular; by sound','a university, an hour'],['the','Known, unique, defined by of/for, superlative','the government, the number of'],['zero','General plural or uncountable','Technology improves education']])+T(['Wrong','Correct'],[['The technology changed life','Technology changed life'],['Government should invest','The government should invest'],['She has good job','She has a good job'],['an university','a university'],['an advice','some advice'],['In the modern society','In modern society']])+`<p>Uncountable (no a/an, no -s): advice, information, research, equipment, traffic, pollution, evidence, progress.</p>`},
{t:'What to avoid, fillers',h:T(['Avoid','Fix'],[['Contractions (don’t)','do not'],['“I think” every paragraph','State view once, then “It can be argued that”'],['always, never, everyone','many, most, often'],['Rhetorical questions, slang','Formal statements'],['etc. / and so on','List 2–3 items'],['Memorised templates','Learn structures, not sentences'],['New ideas in conclusion','Summarise only'],['Sentences over 30 words','Split them']])+`<h3>Fillers</h3>`+T(['Cut','Use'],[['In today’s world','In recent years / delete'],['It is a well-known fact that','delete'],['Due to the fact that','because'],['In order to','to'],['a large number of','many'],['the majority of','most'],['has the ability to','can'],['very important / very bad','crucial / severe']])},
{t:'Vocabulary replacement',h:T(['Basic','Better'],[['good / bad','beneficial / detrimental'],['big / small','substantial / minor'],['important','crucial, vital'],['a lot of','a substantial number of'],['get','obtain, acquire'],['help','facilitate, contribute to'],['show','demonstrate, illustrate'],['think','argue, maintain'],['problem / solve','issue / tackle, address'],['kids / old people','children / the elderly'],['also / but / so','moreover / however / therefore']])+`<h3>Collocations</h3>`+T(['Topic','Chunks'],[['Problem','pose a threat, exacerbate, pressing concern'],['Solution','implement measures, allocate funding, introduce legislation'],['Effect','have a profound impact on, take a toll on'],['Environment','reduce carbon emissions, raise awareness, deplete resources'],['Work','job security, work–life balance, skilled workforce'],['Health','sedentary lifestyle, public health, balanced diet']])+`<p>Unsure of a word? Use the simple correct one.</p>`},
{t:'Task 2 samples: 7 vs 7.5 vs 8',h:`<p><b>Prompt:</b> Governments should spend money on public transport rather than building new roads. To what extent do you agree?</p><p class="mu">Body paragraph shown for each band.</p>`+S('b7','BAND 7','Public transport is better than roads because it is cheaper for many people and reduces traffic. If there are more buses and trains, people will not use their cars, so the roads will be less crowded. For example, in Singapore the metro is very good and many people use it. This also helps the environment because there is less pollution.')+S('b75','BAND 7.5','Investing in public transport is a more effective way to reduce congestion than building new roads. Commuters will leave their cars at home only if buses and trains are faster and cheaper than driving, and a reliable network achieves this. Singapore, for instance, combines an extensive metro system with high vehicle taxes, which keeps traffic flowing in a dense city. This approach also lowers emissions, which benefits public health.')+S('b8','BAND 8','Investing in public transport is a more sustainable solution to congestion than constructing new roads. Commuters will abandon their cars only if the alternative is faster or cheaper, which a frequent and reliable network can deliver. Singapore illustrates this well: an extensive metro system, together with high vehicle taxes, has kept traffic moving in a densely populated city. By contrast, new roads tend to attract additional vehicles, so congestion soon returns, which makes them a short-term fix that also adds to pollution.')+`<h3>What changes</h3>`+T(['','7','7.5','8'],[['Ideas','Simple claims, generic example','Reasoning + specific example','Anticipates counterpoint (new roads attract cars)'],['Vocab','very good, a lot, pollution','congestion, emissions, extensive','abandon, sustainable, short-term fix'],['Grammar','Simple, some slips','Varied, few errors','Complex, near error-free'],['Cohesion','Also / so repeated','Linkers fit meaning','Reference words: this approach, which makes them']])},
{t:'Task 1 samples: 7 vs 7.5 vs 8',h:`<p><b>Prompt:</b> % of adults who exercise regularly.</p>`+T(['Age','2010','2020'],[['18–29','45','55'],['30–44','38','48'],['45–59','30','35'],['60+','20','18']])+S('b7','BAND 7','Overall, more people exercised in 2020 than in 2010, except the oldest group. In 2010, 45% of 18–29 exercised and 20% of 60+. In 2020 the youngest went up to 55% and the oldest went down to 18%.')+S('b75','BAND 7.5','Overall, regular exercise rose in every age group except the oldest, and younger adults were consistently the most active. In 2010, 45% of 18–29s exercised regularly, compared with 20% of those aged 60+. By 2020, the youngest group had risen to 55%, whereas the 60+ group fell slightly to 18%.')+S('b8','BAND 8','Overall, regular exercise became more common in every age group except the oldest, and younger adults were consistently the most active. In 2010, 45% of 18–29s exercised regularly, the highest figure, against 20% of the 60+ group. By 2020, the former had risen by 10 percentage points to 55%, whereas the latter was the only group to decline, falling to 18%, which widened the gap from 25 to 37 points.')+`<h3>What changes</h3>`+T(['','7','7.5','8'],[['Overview','Present, basic','Trend + contrast','Trend + contrast, precise wording'],['Data','Numbers listed','Compared in pairs','Calculated change (+10 points, gap 25→37)'],['Language','up / down','rose / fell, whereas','percentage points, the former/latter, which widened']])},
{t:'Final checklist',h:`<p class="mu">Tick after every practice essay.</p>`+['Answered every part of the question','Position clear in intro and conclusion','Each body: claim + explanation + example','No word repeated 3+ times, no “very + adjective”','No contractions, filler openers or “etc.”','5+ topic collocations used','Articles, plurals, tense, agreement checked','80%+ of sentences error-free','Task 1: overview present, data grouped'].map(x=>`<label><input type="checkbox"> ${x}</label>`).join('')}
]}];
const LOG=[['16 Nov 2026','Writing: 11 modules, band 7 / 7.5 / 8 samples']];
let D={};try{D=JSON.parse(localStorage.getItem('ieltsDone')||'{}')}catch(e){}
const sv=()=>{try{localStorage.setItem('ieltsDone',JSON.stringify(D))}catch(e){}};
window.tg=k=>{D[k]=!D[k];sv();R(1)};
function R(keep){
const m=/^(\w+)-(\d+)$/.exec(location.hash.slice(1)),sk=SK.find(s=>m&&s.id==m[1])||SK[0],a=document.getElementById('a');
document.getElementById('sk').textContent=sk.name;
if(!m||!sk.L[m[2]-1]){const n=sk.L.filter((_,i)=>D[sk.id+'-'+(i+1)]).length,p=Math.round(100*n/sk.L.length);
a.innerHTML=`<h2>${sk.name}</h2><div class="mu">${n}/${sk.L.length} stages done</div><div class="bar"><i style="width:${p}%"></i></div>`+sk.L.map((l,i)=>`<a class="c" href="#${sk.id}-${i+1}"><span class="n">${i+1}</span><span>${l.t}</span><b>${D[sk.id+'-'+(i+1)]?'✓':''}</b></a>`).join('')+`<h3>Updates</h3>`+LOG.map(x=>`<p class="mu">${x[0]}: ${x[1]}</p>`).join('')+`<p class="mu">Speaking, Reading and Listening modules appear here as you learn them.</p>`;}
else{const i=m[2]-1,k=sk.id+'-'+m[2],l=sk.L[i];
a.innerHTML=`<a class="bk" href="#">← All stages</a><h2>${m[2]}. ${l.t}</h2>${l.h}<div class="nav">${i?`<a href="#${sk.id}-${i}">← Prev</a>`:''}<button class="${D[k]?'':'dn'}" onclick="tg('${k}')">${D[k]?'✓ Done':'Mark done'}</button>${sk.L[i+1]?`<a href="#${sk.id}-${i+2}">Next →</a>`:''}</div>`;}
if(!keep)scrollTo(0,0);}
addEventListener('hashchange',()=>R());R();
</script></body></html>
